<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANADA · VIP Black Voucher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 고급스러운 세리프 폰트와 깔끔한 산세리프 폰트 조합 -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<!-- HTML2Canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root {
    /* 럭셔리 컬러 팔레트 */
    --bg-color: #050505;
    --card-bg-1: #111111;
    --card-bg-2: #1a1a1a;
    --gold-light: #F9F1CC;
    --gold-main: #D4AF37;
    --gold-dark: #AA771C;
    --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
    --text-white: #F8F9FA;
    --text-gray: #A0A0A0;
    --border-gold: rgba(212, 175, 55, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg-color);
    color: var(--text-white);
    font-family: 'Pretendard Variable', 'Montserrat', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 70%);
  }

  .app-container {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  /* --- 상단 프리셋 --- */
  .preset-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--gold-main);
    text-transform: uppercase;
  }

  .preset-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .preset-btn {
    background: transparent;
    border: 1px solid var(--border-gold);
    color: var(--text-gray);
    padding: 10px 20px;
    border-radius: 4px;
    font-family: 'Pretendard Variable', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .preset-btn:hover {
    color: var(--gold-light);
    border-color: var(--gold-main);
    background: rgba(212, 175, 55, 0.05);
  }

  .preset-btn.active {
    background: var(--gold-gradient);
    color: #000;
    border-color: transparent;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
  }

  /* --- 바우처 본체 (블랙 카드 스타일) --- */
  .voucher-wrapper {
    width: 100%;
    max-width: 720px;
    padding: 15px; /* 캡처 시 여백 확보 */
    position: relative;
  }

  .voucher {
    display: flex;
    background: linear-gradient(135deg, var(--card-bg-1) 0%, var(--card-bg-2) 100%);
    border-radius: 8px;
    position: relative;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.8),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05),
      inset 0 0 20px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  /* 금박 테두리 (가장자리 포인트) */
  .voucher::before {
    content: '';
    position: absolute;
    top: 6px; left: 6px; right: 6px; bottom: 6px;
    border: 1px solid var(--border-gold);
    border-radius: 4px;
    pointer-events: none;
    z-index: 1;
  }

  /* 광택 효과 */
  .voucher::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.03), transparent);
    transform: skewX(-25deg);
    animation: shine 8s infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes shine {
    0% { left: -100%; }
    20% { left: 200%; }
    100% { left: 200%; }
  }

  /* 좌측 메인 영역 */
  .v-main {
    flex: 1;
    padding: 40px;
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .v-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand-area {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  /* 커스텀 로고 업로드 영역 */
  .logo-upload-wrap {
    position: relative;
    cursor: pointer;
  }
  .logo-upload-wrap input[type="file"] {
    display: none;
  }
  .logo-image {
    max-height: 40px;
    max-width: 120px;
    object-fit: contain;
    display: none; /* 초기엔 숨김 */
  }
  .logo-text {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.25em;
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo-upload-wrap:hover::after {
    content: '로고 변경';
    position: absolute;
    top: -25px; left: 0;
    background: #fff; color: #000;
    font-size: 11px; padding: 2px 6px; border-radius: 3px;
    white-space: nowrap;
  }

  .v-category {
    text-align: right;
  }
  .v-category-title {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--gold-main);
    letter-spacing: 0.15em;
  }
  .v-category-sub {
    font-size: 10px;
    color: var(--text-gray);
    letter-spacing: 0.3em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .v-body {
    margin: 40px 0;
  }

  .v-eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--gold-light);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    margin-bottom: 15px;
    display: inline-block;
    border-bottom: 1px solid var(--border-gold);
    padding-bottom: 5px;
  }

  .v-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .v-value {
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--text-white);
  }

  .v-unit {
    font-size: 32px;
    font-weight: 500;
    color: var(--gold-main);
  }

  .v-desc {
    font-size: 14px;
    color: #b0b0b0;
    font-weight: 300;
    letter-spacing: -0.02em;
  }

  .v-footer {
    display: flex;
    gap: 40px;
  }

  .v-meta {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .v-meta-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    color: var(--text-gray);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .v-meta-value {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--gold-light);
    letter-spacing: 0.05em;
  }

  /* 우측 스텁(절취선) 영역 */
  .v-stub {
    width: 140px;
    border-left: 2px dashed rgba(212, 175, 55, 0.3);
    padding: 30px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 10;
    background: rgba(0,0,0,0.2);
  }

  .stub-title {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--gold-main);
    letter-spacing: 0.3em;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-transform: uppercase;
    text-align: center;
    height: 100px;
  }

  .barcode-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .barcode-img {
    width: 100%;
    height: 60px;
    background: repeating-linear-gradient(
      90deg,
      #fff,
      #fff 2px,
      transparent 2px,
      transparent 5px,
      #fff 5px,
      #fff 6px,
      transparent 6px,
      transparent 9px
    );
    opacity: 0.7;
  }

  .serial-no {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    color: var(--text-gray);
    letter-spacing: 0.1em;
  }

  /* --- 수정 가능 요소 (Edit Mode) --- */
  .editable {
    outline: none;
    border-radius: 4px;
    transition: all 0.2s;
  }
  body.edit-mode .editable {
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.5);
    cursor: text;
    padding: 0 4px;
  }
  body.edit-mode .editable:focus {
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 0 2px var(--gold-main);
  }

  /* --- 하단 컨트롤 패널 --- */
  .control-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    width: 100%;
    margin-top: 10px;
  }

  .date-quick {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    padding: 8px 16px;
    border-radius: 50px;
  }
  .date-quick span { font-size: 12px; color: var(--text-gray); }
  .date-quick button {
    background: none; border: none;
    color: var(--gold-main);
    font-size: 13px; font-weight: 500;
    cursor: pointer; padding: 4px 8px;
    transition: 0.2s;
  }
  .date-quick button:hover { color: #fff; }

  .action-btns {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 14px 28px;
    border-radius: 4px;
    font-family: 'Pretendard Variable', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border-gold);
    color: var(--gold-light);
  }
  .btn-secondary:hover {
    background: rgba(212, 175, 55, 0.1);
  }

  .btn-primary {
    background: var(--gold-gradient);
    border: none;
    color: #000;
  }
  .btn-primary:hover {
    box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
    transform: translateY(-2px);
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(50px);
    background: #fff;
    color: #000;
    padding: 12px 24px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 14px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 1000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  /* 모바일 대응 */
  @media (max-width: 600px) {
    .v-main { padding: 30px 20px; }
    .v-value { font-size: 48px; }
    .v-unit { font-size: 24px; }
    .v-footer { gap: 20px; flex-direction: column; }
    .v-stub { width: 100px; padding: 20px 10px; }
    .logo-text { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- 1. 바우처 타입 선택 -->
  <div class="preset-section">
    <div class="section-title">Select Benefit</div>
    <div class="preset-list">
      <button class="preset-btn active" data-preset="hour">1시간 추가</button>
      <button class="preset-btn" data-preset="meet">1회 만남 무료</button>
      <button class="preset-btn" data-preset="stocking">스타킹 무료</button>
      <button class="preset-btn" data-preset="option">옵션 1개 무료</button>
      <button class="preset-btn" data-preset="cosplay">코스프레 무료</button>
    </div>
  </div>

  <!-- 2. 바우처 본체 -->
  <div class="voucher-wrapper" id="capture-area">
    <div class="voucher">
      
      <!-- 본문 -->
      <div class="v-main">
        <div class="v-header">
          <!-- 커스텀 로고 영역 -->
          <div class="brand-area">
            <label class="logo-upload-wrap" title="클릭하여 로고 이미지 변경">
              <input type="file" id="logo-upload" accept="image/*" onchange="handleLogoUpload(event)">
              <img id="logo-image" class="logo-image" src="" alt="Brand Logo">
              <div id="logo-text" class="logo-text editable" contenteditable="false">BANADA</div>
            </label>
          </div>
          <div class="v-category">
            <div class="v-category-title editable" contenteditable="false">VIP BLACK</div>
            <div class="v-category-sub editable" contenteditable="false">Exclusive Voucher</div>
          </div>
        </div>

        <div class="v-body">
          <div class="v-eyebrow editable" contenteditable="false">Complimentary Gift</div>
          <div class="v-title-wrap">
            <div class="v-value editable" contenteditable="false" id="val-num">1</div>
            <div class="v-unit editable" contenteditable="false" id="val-unit">시간 추가</div>
          </div>
          <div class="v-desc editable" contenteditable="false" id="val-sub">최고의 VIP 고객님께 드리는 특별한 여유 시간 제공권입니다.</div>
        </div>

        <div class="v-footer">
          <div class="v-meta">
            <span class="v-meta-label">Date of Issue</span>
            <span class="v-meta-value editable" contenteditable="false" id="issued-date">2026.10.24</span>
          </div>
          <div class="v-meta">
            <span class="v-meta-label">Valid Thru</span>
            <span class="v-meta-value editable" contenteditable="false" id="valid-until">2026.11.24</span>
          </div>
        </div>
      </div>

      <!-- 절취선(스텁) -->
      <div class="v-stub">
        <div class="stub-title">Admit One</div>
        <div class="barcode-area">
          <div class="barcode-img"></div>
          <div class="serial-no" id="serial-no">BND-9X2A</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 3. 하단 컨트롤 -->
  <div class="control-panel">
    <div class="date-quick">
      <span>유효기간 연장:</span>
      <button onclick="addDays(30)">+30일</button>
      <button onclick="addDays(60)">+60일</button>
      <button onclick="setUnlimited()">무제한</button>
    </div>

    <div class="action-btns">
      <button class="btn btn-secondary" id="edit-toggle-btn" onclick="toggleEditMode()">
        ✎ 직접 텍스트 수정
      </button>
      <button class="btn btn-secondary" onclick="generateSerial()">
        ↻ 시리얼 넘버 갱신
      </button>
      <button class="btn btn-primary" onclick="downloadImage(this)">
        ✨ 초고화질 다운로드
      </button>
    </div>
  </div>

</div>

<div class="toast" id="toast">메시지</div>

<script>
  // --- 1. 텍스트 데이터 셋팅 ---
  const PRESETS = {
    hour:     { num: '1',     unit: '시간 추가',  sub: '최고의 VIP 고객님께 드리는 특별한 여유 시간 제공권입니다.', eyebrow: 'Complimentary Gift' },
    meet:     { num: '1회',   unit: '만남 무료',  sub: '소중한 하루를 위해 준비한 특별한 무료 이용권입니다.', eyebrow: 'Special Privilege' },
    stocking: { num: 'Free', unit: '스타킹',     sub: '원하시는 스타일의 최고급 스타킹 옵션이 무료 제공됩니다.', eyebrow: 'Premium Option' },
    option:   { num: '1ea',  unit: '옵션 무료',  sub: '원하시는 어떠한 옵션이든 1가지를 무료로 선택하실 수 있습니다.', eyebrow: 'Choice Voucher' },
    cosplay:  { num: 'Free', unit: '코스프레',   sub: '다채로운 연출을 위한 프리미엄 테마 의상 옵션을 제공합니다.', eyebrow: 'Special Theme' }
  };

  // 프리셋 버튼 클릭 이벤트
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const data = PRESETS[btn.dataset.preset];
      document.getElementById('val-num').textContent = data.num;
      document.getElementById('val-unit').textContent = data.unit;
      document.getElementById('val-sub').textContent = data.sub;
      document.querySelector('.v-eyebrow').textContent = data.eyebrow;
    });
  });

  // --- 2. 로고 업로드 처리 ---
  function handleLogoUpload(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const imgEl = document.getElementById('logo-image');
        const textEl = document.getElementById('logo-text');
        imgEl.src = e.target.result;
        imgEl.style.display = 'block';
        textEl.style.display = 'none';
        showToast('로고 이미지가 적용되었습니다.');
      }
      reader.readAsDataURL(file);
    }
  }

  // --- 3. 날짜 및 시리얼 관리 ---
  let issueDate = new Date();

  function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}.${m}.${d}`;
  }

  function addDays(days) {
    const expDate = new Date(issueDate);
    expDate.setDate(expDate.getDate() + days);
    document.getElementById('valid-until').textContent = formatDate(expDate);
    showToast(`유효기간이 +${days}일 연장되었습니다.`);
  }

  function setUnlimited() {
    document.getElementById('valid-until').textContent = 'NO EXPIRY (무제한)';
    showToast('유효기간이 무제한으로 설정되었습니다.');
  }

  function generateSerial() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let serial = 'BND-';
    for(let i=0; i<4; i++) {
      serial += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById('serial-no').textContent = serial;
    // 바코드 패턴 랜덤화
    document.querySelector('.barcode-img').style.backgroundPosition = `${Math.random() * 100}px 0`;
  }

  function initVoucher() {
    document.getElementById('issued-date').textContent = formatDate(issueDate);
    addDays(30); // 기본 30일
    generateSerial();
  }

  // --- 4. 직접 수정 모드 ---
  let isEditMode = false;
  function toggleEditMode() {
    isEditMode = !isEditMode;
    document.body.classList.toggle('edit-mode', isEditMode);
    
    const editBtn = document.getElementById('edit-toggle-btn');
    editBtn.innerHTML = isEditMode ? '✓ 텍스트 수정 완료' : '✎ 직접 텍스트 수정';
    
    document.querySelectorAll('.editable').forEach(el => {
      el.setAttribute('contenteditable', isEditMode ? 'true' : 'false');
    });

    if (isEditMode) {
      showToast('변경하려는 텍스트를 클릭하여 수정하세요.');
    }
  }

  // 엔터키 방지 (줄바꿈 방지)
  document.addEventListener('keydown', (e) => {
    if (e.target.classList.contains('editable') && e.key === 'Enter') {
      e.preventDefault();
      e.target.blur();
    }
  });

  // --- 5. 초고화질 이미지 다운로드 (가독성 개선) ---
  async function downloadImage(btn) {
    if (isEditMode) toggleEditMode(); // 다운로드 시 편집 모드 강제 종료

    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳ 렌더링 중...';
    btn.style.pointerEvents = 'none';

    const captureArea = document.getElementById('capture-area');

    try {
      // 폰트가 모두 로드될 때까지 대기하여 뭉개짐 방지
      await document.fonts.ready; 

      const canvas = await html2canvas(captureArea, {
        backgroundColor: null, // 투명 배경 허용
        scale: 4, // 기존 3에서 4로 증가시켜 초고해상도(4K급) 캡처
        useCORS: true,
        logging: false
      });

      const activeLabel = document.querySelector('.preset-btn.active').textContent.replace(/\s/g, '');
      const dateStr = formatDate(new Date()).replace(/\./g, '');
      const filename = `VIP_Voucher_${activeLabel}_${dateStr}.png`;

      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();

      showToast('✨ 고화질 바우처가 저장되었습니다.');
    } catch (error) {
      console.error(error);
      showToast('오류가 발생했습니다. 다시 시도해주세요.');
    } finally {
      btn.innerHTML = originalText;
      btn.style.pointerEvents = 'auto';
    }
  }

  // --- 6. 토스트 메시지 UI ---
  let toastTimeout;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // 실행
  initVoucher();
</script>

</body>
</html>
