<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANADA · 1시간 추가 쿠폰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --coupon-bg: #0f0e0c;
    --coupon-bg-2: #1a1712;
    --gold: #c9a961;
    --gold-bright: #e8c977;
    --gold-dim: #8a7444;
    --cream: #f5f0e6;
    --cream-dim: #a8a196;
    --line: rgba(201, 169, 97, 0.25);
    --line-strong: rgba(201, 169, 97, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Pretendard Variable', 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(201, 169, 97, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(201, 169, 97, 0.04) 0%, transparent 40%);
  }

  .stage {
    perspective: 1400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* ─── 쿠폰 컨테이너 ─── */
  .coupon {
    position: relative;
    width: 560px;
    max-width: 100%;
    background: linear-gradient(135deg, var(--coupon-bg) 0%, var(--coupon-bg-2) 100%);
    display: grid;
    grid-template-columns: 1fr 140px;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 40px rgba(201, 169, 97, 0.08));
    /* 좌우 톱니 모양 */
    -webkit-mask: 
      radial-gradient(circle at 400px 0, transparent 8px, #000 8.5px) top,
      radial-gradient(circle at 400px 100%, transparent 8px, #000 8.5px) bottom;
    -webkit-mask-size: 100% 51%;
    -webkit-mask-repeat: no-repeat;
    mask: 
      radial-gradient(circle at 400px 0, transparent 8px, #000 8.5px) top,
      radial-gradient(circle at 400px 100%, transparent 8px, #000 8.5px) bottom;
    mask-size: 100% 51%;
    mask-repeat: no-repeat;
  }

  .coupon:hover {
    transform: rotateY(-3deg) rotateX(2deg);
  }

  /* 홀로그램 샤인 효과 */
  .coupon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      105deg,
      transparent 30%,
      rgba(232, 201, 119, 0.06) 45%,
      rgba(232, 201, 119, 0.12) 50%,
      rgba(232, 201, 119, 0.06) 55%,
      transparent 70%
    );
    background-size: 200% 100%;
    animation: shine 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 3;
  }

  @keyframes shine {
    0%, 100% { background-position: 200% 0; }
    50% { background-position: -100% 0; }
  }

  /* ─── 메인 섹션 (좌측) ─── */
  .coupon-main {
    padding: 36px 40px 32px;
    position: relative;
    border-right: 1px dashed var(--line-strong);
  }

  /* 상단 헤더 */
  .coupon-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 50%, var(--gold-dim) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: #1a1712;
    letter-spacing: -0.02em;
    box-shadow: 0 2px 8px rgba(201, 169, 97, 0.3);
    /* 이미지 로고로 교체하려면: background-image: url('logo.png'); background-size: cover; */
  }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 0.28em;
    color: var(--gold);
  }

  .coupon-type {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--cream-dim);
    text-transform: uppercase;
    padding-top: 8px;
    text-align: right;
    line-height: 1.6;
  }

  .coupon-type strong {
    display: block;
    color: var(--gold);
    font-weight: 500;
  }

  /* 중앙 콘텐츠 */
  .coupon-body {
    padding: 20px 0 16px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .eyebrow::before,
  .eyebrow::after {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--gold-dim);
  }

  .value {
    font-family: 'Pretendard Variable', sans-serif;
    font-weight: 700;
    font-size: 88px;
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--cream);
    margin-bottom: 12px;
    background: linear-gradient(180deg, var(--cream) 0%, #d4c8a8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .value .unit {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 44px;
    color: var(--gold);
    -webkit-text-fill-color: var(--gold);
    margin-left: 4px;
    vertical-align: 12px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--cream-dim);
    letter-spacing: 0.05em;
  }

  /* 하단 메타 정보 */
  .coupon-meta {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .meta-label {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--cream-dim);
    text-transform: uppercase;
  }

  .meta-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--cream);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* ─── 스텁 섹션 (우측) ─── */
  .coupon-stub {
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(201, 169, 97, 0.03) 0%, transparent 100%);
    position: relative;
  }

  .stub-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .stub-code {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .code-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--cream-dim);
    letter-spacing: 0.1em;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  .barcode {
    display: flex;
    gap: 2px;
    height: 60px;
    align-items: center;
  }

  .barcode span {
    display: block;
    width: 2px;
    background: var(--cream);
    opacity: 0.85;
  }

  .stub-emblem {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 400;
    color: var(--gold);
    line-height: 1;
    font-style: italic;
  }

  /* ─── 컨트롤 (버튼 영역) ─── */
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 12px 24px;
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    font-family: 'Pretendard Variable', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn:hover {
    background: var(--gold);
    color: #0a0a0a;
    border-color: var(--gold);
  }

  .btn-primary {
    background: var(--gold);
    color: #0a0a0a;
    border-color: var(--gold);
  }

  .btn-primary:hover {
    background: var(--gold-bright);
    border-color: var(--gold-bright);
  }

  /* ─── 반응형 ─── */
  @media (max-width: 600px) {
    .coupon {
      width: 100%;
      grid-template-columns: 1fr 100px;
      -webkit-mask: 
        radial-gradient(circle at calc(100% - 100px) 0, transparent 7px, #000 7.5px) top,
        radial-gradient(circle at calc(100% - 100px) 100%, transparent 7px, #000 7.5px) bottom;
      -webkit-mask-size: 100% 51%;
      -webkit-mask-repeat: no-repeat;
      mask: 
        radial-gradient(circle at calc(100% - 100px) 0, transparent 7px, #000 7.5px) top,
        radial-gradient(circle at calc(100% - 100px) 100%, transparent 7px, #000 7.5px) bottom;
      mask-size: 100% 51%;
      mask-repeat: no-repeat;
    }
    .coupon-main { padding: 28px 24px 24px; }
    .value { font-size: 64px; }
    .value .unit { font-size: 32px; }
    .brand-name { font-size: 18px; letter-spacing: 0.2em; }
    .coupon-header { margin-bottom: 24px; }
    .coupon-stub { padding: 20px 8px; }
    .stub-label { font-size: 11px; }
    .barcode { height: 40px; }
  }

  /* ─── 인쇄용 ─── */
  @media print {
    body { background: white; padding: 0; }
    .controls { display: none; }
    .coupon { filter: none; box-shadow: none; }
    .coupon::before { display: none; }
  }

  /* 페이드인 애니메이션 */
  .coupon {
    animation: fadeUp 0.9s cubic-bezier(0.23, 1, 0.32, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- ═══ 쿠폰 본체 ═══ -->
  <div class="coupon" id="coupon">
    
    <!-- 좌측 메인 -->
    <div class="coupon-main">
      
      <!-- 헤더: 로고 + 쿠폰 타입 -->
      <div class="coupon-header">
        <div class="brand">
          <!-- 로고 마크: 이미지로 교체하려면 <img>로 바꾸면 됨 -->
          <div class="logo-mark">B</div>
          <div class="brand-name">BANADA</div>
        </div>
        <div class="coupon-type">
          Special Event<br>
          <strong>Coupon</strong>
        </div>
      </div>

      <!-- 메인 밸류 -->
      <div class="coupon-body">
        <div class="eyebrow">Complimentary Gift</div>
        <div class="value">1<span class="unit">시간 추가</span></div>
        <div class="subtitle">고객님의 특별한 순간을 위해 준비했습니다</div>
      </div>

      <!-- 메타 정보 (발급일 / 유효기간) -->
      <div class="coupon-meta">
        <div class="meta-item">
          <div class="meta-label">Issued Date</div>
          <div class="meta-value" id="issued-date">—</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Valid Until</div>
          <div class="meta-value" id="valid-until">—</div>
        </div>
      </div>
    </div>

    <!-- 우측 스텁 -->
    <div class="coupon-stub">
      <div class="stub-emblem">B</div>
      <div class="barcode" id="barcode"></div>
      <div class="stub-code">
        <div class="code-number" id="coupon-code">NO. —</div>
      </div>
      <div class="stub-label">Admit One</div>
    </div>

  </div>

  <!-- 컨트롤 버튼 -->
  <div class="controls">
    <button class="btn" onclick="window.print()">인쇄하기</button>
    <button class="btn btn-primary" onclick="regenerate()">새 쿠폰 발급</button>
  </div>

</div>

<script>
  // ─── 날짜 & 쿠폰 코드 자동 생성 ───
  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}.${m}.${day}`;
  }

  function generateCouponCode() {
    // 예: BND-A3F2-7K9M
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let code = 'BND-';
    for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
    code += '-';
    for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  function generateBarcode() {
    // 랜덤 폭의 바 40개
    const container = document.getElementById('barcode');
    container.innerHTML = '';
    const widths = [1, 1, 2, 2, 3, 1, 2];
    for (let i = 0; i < 40; i++) {
      const bar = document.createElement('span');
      bar.style.width = widths[Math.floor(Math.random() * widths.length)] + 'px';
      bar.style.opacity = 0.6 + Math.random() * 0.4;
      container.appendChild(bar);
    }
  }

  function render() {
    const today = new Date();
    const expiry = new Date(today);
    expiry.setDate(expiry.getDate() + 30);

    document.getElementById('issued-date').textContent = formatDate(today);
    document.getElementById('valid-until').textContent = formatDate(expiry);
    document.getElementById('coupon-code').textContent = 'NO. ' + generateCouponCode();
    generateBarcode();
  }

  function regenerate() {
    const coupon = document.getElementById('coupon');
    coupon.style.animation = 'none';
    coupon.offsetHeight; // reflow
    coupon.style.animation = '';
    render();
  }

  render();
</script>

</body>
</html>
